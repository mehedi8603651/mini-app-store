AWSTemplateFormatVersion: '2010-09-09'
Description: Bounded accepted-friendship Publisher API for the Friends mini-program.

Parameters:
  CodeBucket:
    Type: String
  CodeKey:
    Type: String
  DailyRequestLimit:
    Type: Number
    Default: 500
  MaxFriendsPerUser:
    Type: Number
    Default: 100
  MaxPendingRequests:
    Type: Number
    Default: 50

Resources:
  SocialTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true

  InvitesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: tokenHash
          AttributeType: S
      KeySchema:
        - AttributeName: tokenHash
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  QuotaTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: quotaKey
          AttributeType: S
      KeySchema:
        - AttributeName: quotaKey
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: mini-app-store-friends-users
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: false
          RequireUppercase: false
          RequireNumbers: true
          RequireSymbols: false
      UserPoolAddOns:
        AdvancedSecurityMode: 'OFF'

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: mini-app-store-friends-client
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 7
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days

  FunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: FriendsDataAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:DeleteItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                  - dynamodb:TransactWriteItems
                Resource:
                  - !GetAtt SocialTable.Arn
                  - !GetAtt InvitesTable.Arn
                  - !GetAtt QuotaTable.Arn
              - Effect: Allow
                Action:
                  - cognito-idp:AdminCreateUser
                  - cognito-idp:AdminSetUserPassword
                  - cognito-idp:InitiateAuth
                  - cognito-idp:RevokeToken
                Resource: !GetAtt UserPool.Arn

  FriendsFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: mini-app-store-friends-api
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt FunctionRole.Arn
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref CodeKey
      MemorySize: 384
      Timeout: 20
      Environment:
        Variables:
          SOCIAL_TABLE_NAME: !Ref SocialTable
          INVITES_TABLE_NAME: !Ref InvitesTable
          QUOTA_TABLE_NAME: !Ref QuotaTable
          USER_POOL_ID: !Ref UserPool
          USER_POOL_CLIENT_ID: !Ref UserPoolClient
          DAILY_REQUEST_LIMIT: !Ref DailyRequestLimit
          MAX_FRIENDS_PER_USER: !Ref MaxFriendsPerUser
          MAX_PENDING_REQUESTS: !Ref MaxPendingRequests

  FunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${FriendsFunction}'
      RetentionInDays: 7

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: mini-app-store-friends-api
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - '*'
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - authorization
          - content-type
          - x-mini-program-app-id
          - x-mini-program-host-app
          - x-mini-program-host-version
          - x-mini-program-sdk-version
          - x-mini-program-platform
          - x-mini-program-locale

  Integration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt FriendsFunction.Arn
      PayloadFormatVersion: '2.0'
      TimeoutInMillis: 20000

  JwtAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref HttpApi
      Name: friends-cognito
      AuthorizerType: JWT
      IdentitySource:
        - '$request.header.Authorization'
      JwtConfiguration:
        Audience:
          - !Ref UserPoolClient
        Issuer: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}'

  HealthRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: GET /health
      Target: !Sub 'integrations/${Integration}'

  SignUpRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: POST /auth/email/sign-up
      Target: !Sub 'integrations/${Integration}'

  SignInRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: POST /auth/email/sign-in
      Target: !Sub 'integrations/${Integration}'

  RefreshRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: POST /auth/refresh
      Target: !Sub 'integrations/${Integration}'

  SignOutRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: POST /auth/sign-out
      Target: !Sub 'integrations/${Integration}'

  CreateInviteRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: POST /friend-invites
      Target: !Sub 'integrations/${Integration}'
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer

  RedeemInviteRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: POST /friend-invites/redeem
      Target: !Sub 'integrations/${Integration}'
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer

  ListRequestsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: GET /friend-requests
      Target: !Sub 'integrations/${Integration}'
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer

  AcceptRequestRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: POST /friend-requests/accept
      Target: !Sub 'integrations/${Integration}'
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer

  DeclineRequestRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: POST /friend-requests/decline
      Target: !Sub 'integrations/${Integration}'
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer

  ListFriendsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: GET /friends
      Target: !Sub 'integrations/${Integration}'
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer

  RemoveFriendRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: POST /friends/remove
      Target: !Sub 'integrations/${Integration}'
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer

  DefaultStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: '$default'
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 10
        ThrottlingRateLimit: 3

  InvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref FriendsFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*'

Outputs:
  BackendBaseUrl:
    Value: !GetAtt HttpApi.ApiEndpoint
  SocialTableName:
    Value: !Ref SocialTable
  InvitesTableName:
    Value: !Ref InvitesTable
  QuotaTableName:
    Value: !Ref QuotaTable
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
